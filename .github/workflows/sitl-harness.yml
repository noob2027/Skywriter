name: Pinned SITL harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-sitl:
    name: Ubuntu / stock ArduCopter 4.6.3 / twice
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MAVLINK20: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compatibility/arducopter-4.6.3/requirements-probe.lock
            pyproject.toml
      - name: Install exact probe dependency and test runner
        run: |
          python -m pip install \
            --require-hashes \
            --requirement compatibility/arducopter-4.6.3/requirements-probe.lock
          python -m pip install pytest==9.1.1
      - name: Restore verified stock binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/skywriter-sitl
          key: arducopter-sitl-linux-x86_64-7862662092edc2861fc03da3d6fb2f0136d1670e563ca324eb52c1a324d1e14b
      - name: Acquire and verify exact official stock binary
        run: |
          mkdir -p "$RUNNER_TEMP/sitl-evidence"
          python -m scripts.sitl.acquire \
            --destination "$RUNNER_TEMP/skywriter-sitl/arducopter" \
            --record "$RUNNER_TEMP/sitl-evidence/acquisition.json"
      - name: Validate platform-independent harness contract
        run: python -m pytest tests/sitl/test_harness_contract.py -q --durations=10
      - name: Run pinned smoke evidence 1
        env:
          SKYWRITER_SITL_BINARY: ${{ runner.temp }}/skywriter-sitl/arducopter
          SKYWRITER_SITL_EVIDENCE: ${{ runner.temp }}/sitl-evidence/run-1
          SKYWRITER_SITL_BASE_PORT: "26000"
        run: python -m pytest tests/sitl/test_pinned_sitl_smoke.py -q --durations=10
      - name: Run pinned smoke evidence 2
        env:
          SKYWRITER_SITL_BINARY: ${{ runner.temp }}/skywriter-sitl/arducopter
          SKYWRITER_SITL_EVIDENCE: ${{ runner.temp }}/sitl-evidence/run-2
          SKYWRITER_SITL_BASE_PORT: "26100"
        run: python -m pytest tests/sitl/test_pinned_sitl_smoke.py -q --durations=10
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-sitl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sitl-evidence
          if-no-files-found: error
          retention-days: 30
