name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact dependencies and project
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Smoke launch and close
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from skywriter.main import run; raise SystemExit(run(['skywriter-ci'], close_after_ms=0))"
