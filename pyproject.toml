[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skywriter"
version = "0.1.1"
description = "Windows desktop foundation for the SKYWriter mission console"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6-Addons==6.11.1",
    "PySide6-Essentials==6.11.1",
    "pymavlink==2.4.41",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[project.scripts]
skywriter = "skywriter.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skywriter = ["ui/map/static/**/*"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = ["sitl: requires the exact approved stock ArduCopter SITL artifact"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = ["src", "."]
files = ["src", "tests", "scripts/sitl"]

[[tool.mypy.overrides]]
module = ["pymavlink", "pymavlink.*"]
ignore_missing_imports = true
