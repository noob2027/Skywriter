<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SKYWriter offline route canvas</title>
    <link rel="stylesheet" href="map.css">
  </head>
  <body>
    <main aria-label="Offline mission route canvas">
      <header>
        <strong>OFFLINE ROUTE CANVAS</strong>
        <span>Schematic coordinates · no tile network</span>
      </header>
      <canvas id="mission-map" width="960" height="640" tabindex="0"></canvas>
      <p id="status" role="status">Click to place a pending mission point.</p>
    </main>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="map.js"></script>
  </body>
</html>
